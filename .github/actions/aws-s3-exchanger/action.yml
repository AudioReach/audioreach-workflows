---
name: AWS S3 Exchanger
description: Upload and download files from AWS S3

inputs:
  s3_bucket:
    description: S3 Bucket Name
    required: true
  local_file:
    description: Local file paths
    required: false
    default: ''
  download_filename:
    description: The name of the file to download
    required: true
    default: ''
  download_latest:
    description: Download the newest object with the exact filename under location
    required: false
    default: 'false'
  location:
    description: S3 location, or the base prefix to search when download_latest is true
    required: true
    default: ''
  mode:
    description: Mode of operation (upload/download)
    required: true
    default: upload
  upload_location:
    description: Upload location
    required: false
    default: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.run_id }}-${{ github.run_attempt }}/

runs:
  using: "composite"
  steps:

    - name: Sync Data
      id: sync_data
      shell: bash
      env:
        UPLOAD_LOCATION: ${{ inputs.upload_location }}
        INPUT_LOCATION: ${{ inputs.location }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_LOCAL_FILE: ${{ inputs.local_file }}
        INPUT_S3_BUCKET: ${{ inputs.s3_bucket }}
        INPUT_DOWNLOAD_FILENAME: ${{ inputs.download_filename }}
        INPUT_DOWNLOAD_LATEST: ${{ inputs.download_latest }}
        WORKSPACE_DIR: ${{ github.workspace }}
        IMAGE_NAME: ${{ env.IMAGE_NAME }}
      run: |
        set -euo pipefail

        location_prefix="${INPUT_LOCATION}"
        if [ -n "$location_prefix" ]; then
          location_prefix="${location_prefix%/}/"
        fi

        case "${INPUT_MODE}" in
          upload)
            echo "::group::$(printf '__________ %-100s' 'Process' | tr ' ' _)"
            echo "Uploading file to S3 bucket..."
            aws s3 cp "${INPUT_LOCAL_FILE}" "s3://${INPUT_S3_BUCKET}/${location_prefix}${UPLOAD_LOCATION}${IMAGE_NAME}/"
            echo "Uploaded ${INPUT_LOCAL_FILE} to s3://${INPUT_S3_BUCKET}/${location_prefix}${UPLOAD_LOCATION}${IMAGE_NAME}/"
            echo "::endgroup::"
            echo "Creating Pre-signed URL for ${INPUT_LOCAL_FILE}..."
            filename="$(basename "${INPUT_LOCAL_FILE}")"
            echo "Filename: $filename"
            presigned_url="$(aws s3 presign "s3://${INPUT_S3_BUCKET}/${location_prefix}${UPLOAD_LOCATION}${IMAGE_NAME}/$filename" --expires-in 3600)"
            echo "Pre-signed URL: $presigned_url"

            # Make URL available as a step output (fixed key)
            echo "presigned_url=${presigned_url}" >> "$GITHUB_OUTPUT"

            # Also write the URL into a uniquely named file for artifact download
            mkdir -p "${WORKSPACE_DIR}/presigned_urls"
            echo "${presigned_url}" > "${WORKSPACE_DIR}/presigned_urls/presigned_url_${IMAGE_NAME}.txt"
            ;;
          download)
            download_key="${location_prefix}${INPUT_DOWNLOAD_FILENAME}"
            if [ "${INPUT_DOWNLOAD_LATEST}" = "true" ]; then
              case "${INPUT_DOWNLOAD_FILENAME}" in
                ""|.|..|*/*)
                  echo "download_filename must be a filename when download_latest is true" >&2
                  exit 1
                  ;;
              esac

              # JSON output combines all AWS CLI listing pages before selecting the latest object.
              download_key="$(
                aws s3api list-objects-v2 \
                  --bucket "${INPUT_S3_BUCKET}" \
                  --prefix "${location_prefix}" \
                  --output json |
                jq -r --arg filename "${INPUT_DOWNLOAD_FILENAME}" '
                  (.Contents // [])
                  | map(select((.Key | split("/") | last) == $filename))
                  | sort_by(.LastModified, .Key)
                  | last
                  | .Key // empty
                '
              )"

              if [ -z "${download_key}" ]; then
                echo "No file named ${INPUT_DOWNLOAD_FILENAME} under s3://${INPUT_S3_BUCKET}/${location_prefix}" >&2
                exit 1
              fi
            fi

            echo "::group::$(printf '__________ %-100s' 'Process' | tr ' ' _)"
            echo "Downloading s3://${INPUT_S3_BUCKET}/${download_key}"
            aws s3 cp "s3://${INPUT_S3_BUCKET}/${download_key}" .
            echo "::endgroup::"
            chmod 0755 -- "${INPUT_DOWNLOAD_FILENAME}"
            echo "Downloaded ${INPUT_DOWNLOAD_FILENAME} from s3://${INPUT_S3_BUCKET}/${download_key}"
            ;;
          *)
            echo "Invalid mode. Use 'upload' or 'download'."
            exit 1
            ;;
        esac

    - name: Upload Pre-signed URL
      id: upload_presigned_url
      if: ${{ inputs.mode == 'upload' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: presigned_url_${{ env.IMAGE_NAME }}.txt
        path: ${{ github.workspace }}/presigned_urls/presigned_url_${{ env.IMAGE_NAME }}.txt
        retention-days: 1
